<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA World Cup 2026 — World Cup Prediction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #F5C800;
      --gold-bright: #FFD700;
      --gold-dim: rgba(245,200,0,0.15);
      --purple-bg: #1a0535;
      --purple-header: #0e0020;
      --purple-tabs: #150330;
      --purple-page: #1c0a38;
      --purple-card: #2a1248;
      --purple-card-border: rgba(255,255,255,0.12);
      --purple-group-header: #3a1a60;
      --purple-row-divider: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.5);
      --red: #ff5c5c;
      --red-dim: rgba(255,92,92,0.15);
      --elim: rgba(255,255,255,0.2);
    }

    html { background: var(--purple-bg); }

    body {
      color: var(--text);
      font-family: 'Barlow Condensed', 'Anton', sans-serif;
      min-height: 100vh;
      background: var(--purple-page);
    }

    /* ─── HEADER ─── */
    .header {
      background: var(--purple-header);
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 0;
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .tvj-logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      height: 44px;
    }
    .tvj-logo svg { height: 100%; width: auto; }

    .header-center-divider {
      width: 2px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      margin: 0 20px;
      flex-shrink: 0;
    }

    .header-title {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1;
      flex: 1;
    }

    .total-votes-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .total-votes-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1;
      margin-bottom: 2px;
    }
    .total-votes-num {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 32px;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 12px rgba(245,200,0,0.35);
    }

    /* ─── TABS BAR ─── */
    .tabs-wrap {
      background: var(--purple-tabs);
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 2px 8px rgba(245,200,0,0.15);
      position: sticky;
      top: 64px;
      z-index: 100;
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      padding: 0 1.5rem;
      scrollbar-width: none;
      max-width: 1100px;
      margin: 0 auto;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      padding: 12px 18px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -3px;
      white-space: nowrap;
      transition: color .2s, border-color .2s;
      flex-shrink: 0;
    }
    .tab:hover:not(.active) { color: rgba(255,255,255,0.75); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); text-shadow: 0 0 8px rgba(245,200,0,0.25); }

    /* ─── PAGE ─── */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0;
      background: linear-gradient(180deg, #3a1060 0%, #1c0a38 180px);
    }

    /* ─── STAGE BANNER ─── */
    .stage-banner {
      background: linear-gradient(90deg, rgba(180,100,255,0.25) 0%, rgba(80,20,140,0.15) 100%);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stage-banner-title {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(245,200,0,0.25);
    }
    .stage-banner-note {
      font-size: 13px;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
    }

    /* ─── CONTENT AREA ─── */
    .content-area {
      padding: 16px 20px 60px;
      background: var(--purple-page);
    }

    /* ─── DATE HEADERS ─── */
    .date-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 26px 2px 12px;
    }
    .date-header:first-child { margin-top: 6px; }
    .date-header-label {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 8px rgba(245,200,0,0.2);
      white-space: nowrap;
    }
    .date-header-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(245,200,0,0.4), rgba(255,255,255,0.06));
    }
    .date-header-count {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ─── MATCHES GRID ─── */
    .matches-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .match-card {
      background: var(--purple-card);
      border: 1px solid var(--purple-card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .2s, box-shadow .2s;
    }
    .match-card.picked {
      border-color: rgba(245,200,0,0.45);
      box-shadow: 0 0 12px rgba(245,200,0,0.1);
    }
    .match-card.final-card { border-color: var(--gold); box-shadow: 0 0 18px rgba(245,200,0,0.18); }

    .match-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--purple-group-header);
    }
    .match-meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .match-meta-left b { color: rgba(255,255,255,0.85); font-weight: 700; }

    .badge-live, .badge-delayed {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .badge-live { color: #1a0535; background: var(--gold); box-shadow: 0 0 8px rgba(245,200,0,0.3); }
    .badge-delayed { color: var(--muted); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); }

    /* ─── TEAM 1 v TEAM 2 ROW ─── */
    .match-teams {
      display: flex;
      align-items: stretch;
      padding: 14px 10px 10px;
      gap: 4px;
    }

    .team-side {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      padding: 8px 4px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      min-width: 0;
    }
    .team-side:hover { background: rgba(255,255,255,0.05); }
    .team-side.picked {
      background: rgba(245,200,0,0.08);
      border-color: rgba(245,200,0,0.5);
    }
    .team-side.tbd { cursor: default; }
    .team-side.tbd:hover { background: transparent; }

    .team-flag {
      font-size: 34px;
      line-height: 1;
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    }
    .team-name {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .5px;
      text-transform: uppercase;
      line-height: 1.1;
      color: #fff;
      max-width: 100%;
      overflow-wrap: break-word;
    }
    .team-side.picked .team-name { color: var(--gold); text-shadow: 0 0 8px rgba(245,200,0,0.3); }
    .team-pct {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: var(--muted);
    }
    .team-side.picked .team-pct { color: var(--gold); }

    .tbd-chip {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.25);
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: rgba(255,255,255,0.65);
      letter-spacing: .5px;
    }
    .tbd-sub {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
    }

    .vs-divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 44px;
      gap: 2px;
    }
    .vs-divider span {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.35);
    }

    /* split vote bar */
    .match-bar {
      display: flex;
      height: 5px;
      border-radius: 3px;
      overflow: hidden;
      background: rgba(255,255,255,0.1);
      margin: 0 14px 10px;
    }
    .match-bar .b1 {
      background: var(--gold);
      box-shadow: 0 0 6px rgba(245,200,0,0.25);
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }
    .match-bar .b2 {
      background: rgba(255,255,255,0.35);
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    .match-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 12px;
      border-top: 1px solid var(--purple-row-divider);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      color: var(--muted);
      margin-top: auto;
    }
    .match-foot .kick {
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.85);
    }
    .match-foot .kick small {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--muted);
      margin-left: 4px;
    }
    .match-foot .venue { text-align: right; letter-spacing: .5px; }

    /* ─── NOTIFICATION ─── */
    .notif {
      position: fixed;
      top: 16px; right: 16px;
      z-index: 9999;
      background: var(--gold);
      color: #1a0535;
      font-family: 'Anton', 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 10px 20px;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(245,200,0,0.25);
    }
    .notif.show { opacity: 1; transform: translateY(0); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 760px) {
      .header { padding: 0 1rem; height: auto; min-height: 56px; flex-wrap: wrap; padding: 8px 1rem; gap: 6px; }
      .header-title { font-size: 18px; }
      .header-center-divider { display: none; }
      .matches-grid { grid-template-columns: 1fr; }
      .content-area { padding: 12px 12px 60px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .match-bar .b1, .match-bar .b2, .notif { transition: none; }
    }
  </style>
</head>

    const STAGES = ['groups','r32','r16','qf','sf','final'];
    const STAGE_LABELS = {
      groups: 'Group Stage',
      r32:    'Round of 32',
      r16:    'Round of 16',
      qf:     'Quarter-Finals',
      sf:     'Semi-Finals',
      final:  'Finals',
    };
    const STAGE_NOTES = {
      groups: 'Tap a team to predict the winner of each match',
      r32:    'Matchups confirmed after the group stage',
      r16:    'Matchups confirmed after the Round of 32',
      qf:     'Matchups confirmed after the Round of 16',
      sf:     'Matchups confirmed after the Quarter-Finals',
      final:  'Third place match & the Grand Final',
    };

    /* ══════════════════════════════════════
       STATE
    ══════════════════════════════════════ */
    const STORAGE_KEY = 'wc2026_matches_v1';

    function buildInitialState() {
      const matches = {};
      MATCHES.forEach(m => { matches[m.n] = { v1: 0, v2: 0, pick: null }; });
      return { matches };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (p.matches) {
            // ensure every match has an entry
            MATCHES.forEach(m => { if (!p.matches[m.n]) p.matches[m.n] = { v1:0, v2:0, pick:null }; });
            return p;
          }
        }
      } catch (e) {}
      return buildInitialState();
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    let state = loadState();
    let activeTab = 'groups';

    /* ══════════════════════════════════════
       HELPERS
    ══════════════════════════════════════ */
    function getTotalVotes() {
      return Object.values(state.matches).reduce((s, m) => s + m.v1 + m.v2, 0);
    }

    let notifTimer = null;
    function showNotif(msg) {
      const el = document.getElementById('notif');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(notifTimer);
      notifTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    /* ══════════════════════════════════════
       ACTIONS
    ══════════════════════════════════════ */
    function castVote(matchN, side) {
      const m = MATCHES.find(x => x.n === matchN);
      if (!m || !m.t1) return; // TBD matches not votable
      const rec = state.matches[matchN];
      const team = TEAMS[side === 1 ? m.t1 : m.t2];

      if (rec.pick === side) {
        // un-pick
        if (side === 1) rec.v1 = Math.max(0, rec.v1 - 1); else rec.v2 = Math.max(0, rec.v2 - 1);
        rec.pick = null;
        showNotif(`Removed pick: ${team.flag} ${team.name}`);
      } else {
        // switch or new pick
        if (rec.pick === 1) rec.v1 = Math.max(0, rec.v1 - 1);
        if (rec.pick === 2) rec.v2 = Math.max(0, rec.v2 - 1);
        if (side === 1) rec.v1++; else rec.v2++;
        rec.pick = side;
        showNotif(`⚽ ${team.flag} ${team.name} to win Match ${matchN}!`);
      }
      saveState(); renderAll();
    }

    /* ══════════════════════════════════════
       RENDER
    ══════════════════════════════════════ */
    function renderAll() {
      document.getElementById('total-count').textContent = getTotalVotes().toLocaleString();
      renderTabs();
      renderContent();
    }

    function renderTabs() {
      const tabsEl = document.getElementById('tabs');
      tabsEl.innerHTML = STAGES.map(s => `
        <div class="tab ${activeTab === s ? 'active' : ''}" onclick="activeTab='${s}';renderAll()">
          ${STAGE_LABELS[s]}
        </div>`).join('');
    }

    function teamSideHTML(m, side) {
      const rec = state.matches[m.n];
      const total = rec.v1 + rec.v2;
      const votes = side === 1 ? rec.v1 : rec.v2;
      const pct = total ? Math.round((votes / total) * 100) : 0;
      const isPicked = rec.pick === side;

      const teamId = side === 1 ? m.t1 : m.t2;
      if (teamId) {
        const t = TEAMS[teamId];
        return `
          <div class="team-side ${isPicked ? 'picked' : ''}" onclick="castVote(${m.n}, ${side})" role="button" tabindex="0"
               onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();castVote(${m.n}, ${side})}">
            <span class="team-flag">${t.flag}</span>
            <span class="team-name">${t.name}</span>
            <span class="team-pct">${total ? pct + '%' : '—'}</span>
          </div>`;
      }
      // TBD placeholder (knockouts)
      const code = side === 1 ? m.p1 : m.p2;
      return `
        <div class="team-side tbd">
          <span class="tbd-chip">${code.length > 4 ? code.split(' ')[0] : code}</span>
          <span class="team-name" style="color:rgba(255,255,255,0.55)">${code}</span>
          <span class="tbd-sub">TBD</span>
        </div>`;
    }

    function matchCardHTML(m) {
      const rec = state.matches[m.n];
      const total = rec.v1 + rec.v2;
      const p1 = total ? Math.round((rec.v1 / total) * 100) : 50;
      const hasTeams = !!m.t1;

      return `
        <div class="match-card ${rec.pick ? 'picked' : ''} ${m.isFinal ? 'final-card' : ''}">
          <div class="match-meta">
            <div class="match-meta-left"><b>Match ${m.n}</b><span>·</span><span>${m.tag}</span></div>
            ${m.live ? `<span class="badge-live">TVJ Live</span>` : `<span class="badge-delayed">Delayed</span>`}
          </div>
          <div class="match-teams">
            ${teamSideHTML(m, 1)}
            <div class="vs-divider"><span>VS</span></div>
            ${teamSideHTML(m, 2)}
          </div>
          ${hasTeams && total ? `
            <div class="match-bar">
              <div class="b1" style="width:${p1}%"></div>
              <div class="b2" style="width:${100 - p1}%"></div>
            </div>` : ''}
          <div class="match-foot">
            <span class="kick">${m.time}<small>JA TIME</small></span>
            <span class="venue">${m.venue}</span>
          </div>
        </div>`;
    }

    function renderContent() {
      const stage = activeTab;

      document.getElementById('stage-banner').innerHTML = `
        <div class="stage-banner-title">${STAGE_LABELS[stage]}</div>
        <div class="stage-banner-note">${STAGE_NOTES[stage]}</div>
      `;

      const list = MATCHES.filter(m => m.stage === stage);

      // group by date, preserving order
      const days = [];
      list.forEach(m => {
        let d = days.find(x => x.date === m.date);
        if (!d) { d = { date: m.date, matches: [] }; days.push(d); }
        d.matches.push(m);
      });

      let html = '';
      days.forEach(d => {
        html += `
          <div class="date-header">
            <span class="date-header-label">${d.date}</span>
            <span class="date-header-line"></span>
            <span class="date-header-count">${d.matches.length} match${d.matches.length !== 1 ? 'es' : ''}</span>
          </div>
          <div class="matches-grid">
            ${d.matches.map(matchCardHTML).join('')}
          </div>`;
      });

      document.getElementById('main-content').innerHTML = html;
    }

    renderAll();
  </script>
